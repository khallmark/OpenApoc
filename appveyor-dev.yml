version: '{branch}-0.0.{build}'
# Branch coverage reconciliation (OPE-4): this file's `branches: except:` and
# appveyor.yml's `branches: only:` list the exact same two patterns, so every
# branch is covered by exactly one of the two files -- no gap and no overlap.
# This file intentionally skips the NSIS installer and debug-symbol packaging
# that appveyor.yml does for master/release builds.
#
# This file only actually builds anything if a *second* AppVeyor project for
# this repository has "Custom configuration .yml file name" set to
# appveyor-dev.yml in its project settings -- that is server-side AppVeyor
# configuration, not something expressed or verifiable from this repo tree.
branches:
  except:
  - master
  - /release.*/
skip_tags: true
os: Visual Studio 2022
configuration:
  - Release
platform:
  - x64
environment:
  APPVEYOR_SAVE_CACHE_ON_ERROR: true
  VCPKG_DEFAULT_TRIPLET: x64-windows
  VCVARS_ARCH: amd64
  QTPATH: C:\Qt\6.9\msvc2022_64
#clone_depth: 10
cache: C:\Users\appveyor\AppData\Local\vcpkg\archives -> appveyor-dev.yml
before_build:
  - cd c:\tools\vcpkg
  - git pull
  - git checkout 2025.09.17
  - .\bootstrap-vcpkg.bat
  - cd %APPVEYOR_BUILD_FOLDER%
  - vcpkg install
  - git submodule update --init --recursive
  # s2.jonnyh.net does not serve this asset over TLS: a handshake on port 443
  # fails at the ClientHello with two independent TLS stacks (LibreSSL/curl:
  # "tlsv1 alert protocol version"; OpenSSL/python: "wrong version number") --
  # there is no HTTPS listener to switch to here. Prefer https:// instead of
  # this http:// if that ever changes.
  #
  # Until then, the pinned SHA-256 below is the real control: it is
  # trust-on-first-use, proving the artifact hasn't changed since this pin was
  # recorded -- it does NOT prove the original download was authentic, since a
  # compromise predating the pin would be pinned right along with it. The file
  # has been byte-stable since 2016-10-04 (fixed Last-Modified/ETag), so
  # pinning is low-risk. The check must fail the build (not merely warn) and
  # must run before the archive is extracted.
  #
  # If this asset is ever legitimately replaced upstream, CI will fail here
  # with an opaque hash mismatch. To roll the pin forward, download the new
  # file and recompute its hash with:
  #   (Get-FileHash temp\cd.iso.xz -Algorithm SHA256).Hash
  # then update $expected below to match.
  - curl http://s2.jonnyh.net/pub/cd_minimal.iso.xz -o temp\cd.iso.xz
  - ps: |
      $expected = '4E0E93A4110C2E52778D1468B96D02BD062324121773C345913EBF6852000631'
      $actual = (Get-FileHash temp\cd.iso.xz -Algorithm SHA256).Hash
      if ($actual -ne $expected) {
        throw "cd_minimal.iso.xz checksum mismatch: got $actual, expected $expected"
      }
  - 7z e temp\cd.iso.xz -odata\
  - call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvarsall.bat" %VCVARS_ARCH%
build_script:
  - cmake -DMSVC_PDB=ON -DUSE_PCH=ON . -GNinja -DCMAKE_TOOLCHAIN_FILE=c:/tools/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE="%CONFIGURATION%" -DCMAKE_PREFIX_PATH=%QTPATH% -DUSE_SYSTEM_QT=ON
  - cmake --build .
after_build:
  - git describe --tags > build-id
  - set /p OPENAPOC_VERSION= < build-id
  - set OPENAPOC_FILENAME=OpenApoc-%PLATFORM%-%OPENAPOC_VERSION%.zip
  - set OPENAPOC_DEBUG_FILENAME=OpenApoc-debug-%PLATFORM%-%OPENAPOC_VERSION%.zip
  - 7z a %OPENAPOC_DEBUG_FILENAME% bin\OpenApoc.pdb bin\OpenApoc_Launcher.pdb -mx=9 -myx=7
  - appveyor PushArtifact %OPENAPOC_DEBUG_FILENAME%
  - del bin\*.pdb
  - del bin\*.exp
  - del bin\*.ilk
  - del bin\*.lib
  - mkdir OpenApoc-%OPENAPOC_VERSION%
  - xcopy /E bin OpenApoc-%OPENAPOC_VERSION%\
  - echo %APPVEYOR_REPO_COMMIT% > OpenApoc-%OPENAPOC_VERSION%\git-commit
  - echo %OPENAPOC_VERSION% > OpenApoc-%OPENAPOC_VERSION%\build-id
  - start %QTPATH%\bin\windeployqt ---no-opengl-sw --no-compiler-runtime OpenApoc-%OPENAPOC_VERSION%\OpenApoc_Launcher.exe
  - del data\cd.iso
  - xcopy /E data OpenApoc-%OPENAPOC_VERSION%\data\
  - copy portable.txt OpenApoc-%OPENAPOC_VERSION%\
  - copy README.md OpenApoc-%OPENAPOC_VERSION%\README.txt
  - copy README_HOTKEYS.txt OpenApoc-%OPENAPOC_VERSION%\
  - 7z a %OPENAPOC_FILENAME% OpenApoc-%OPENAPOC_VERSION%
  - appveyor PushArtifact %OPENAPOC_FILENAME%

before_test:
  - 7z e temp\cd.iso.xz -odata\
test_script:
  - ctest -T Test -V --no-compress-output -C %CONFIGURATION%
after_test:
  - ps: |
      $testFile = ".\Testing\$(Get-Content Testing\TAG -TotalCount 1)\Test.xml"
      $XSLInputElement = New-Object System.Xml.Xsl.XslCompiledTransform
      $XSLInputElement.Load((Resolve-Path .\tests\ctest-to-junit.xsl))
      $XSLInputElement.Transform((Resolve-Path $testFile), (Join-Path (Resolve-Path .) "ctest-to-junit-results.xml"))
      $wc = New-Object 'System.Net.WebClient'
      $wc.UploadFile("https://ci.appveyor.com/api/testresults/junit/$($env:APPVEYOR_JOB_ID)", (Resolve-Path .\ctest-to-junit-results.xml))
