name: Harness

on: [push, pull_request]

jobs:
  ignored-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm depot, ISO, and Ghidra DBs stay ignored
        run: ./tools/check_ignored_binaries.sh
      - name: Compare report matches in-repo sources
        run: python3 tools/regen_compare_report.py --check
      - name: Compare report ordering is deterministic
        run: python3 tools/test_regen_compare_report.py
      - name: Robot result contracts are truthful
        run: |
          for test_file in tools/test_oa_*.py; do
            python3 "$test_file"
          done
