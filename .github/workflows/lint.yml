name: Lint

on: [push, pull_request]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  CLANG_FORMAT: clang-format-18
  CLANG_TIDY: clang-tidy-18

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Create Build Environment
      # Some projects don't allow in-source building, so create a separate build directory
      # We'll use this as our working directory for all subsequent commands
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Download minimal cd image
      # HTTP only: s2.jonnyh.net does not serve HTTPS on :443 (port answers SSH,
      # confirmed 2026-08-27); integrity is enforced below via checksum instead of TLS.
      run: wget http://s2.jonnyh.net/pub/cd_minimal.iso.xz -O $GITHUB_WORKSPACE/data/cd.iso.xz

    - name: Verify minimal cd image checksum
      run: |
        echo "4e0e93a4110c2e52778d1468b96d02bd062324121773c345913ebf6852000631  $GITHUB_WORKSPACE/data/cd.iso.xz" | sha256sum -c -

    - name: Extract minimal cd image
      run: xz -d $GITHUB_WORKSPACE/data/cd.iso.xz

    - name: Update apt-get repo
      run: sudo apt-get update

    - name: Install dependencies
      run: sudo apt-get install libsdl2-dev cmake build-essential git libunwind8-dev libboost-locale-dev libboost-filesystem-dev libboost-program-options-dev qt6-base-dev libvorbis-dev ninja-build ${CLANG_FORMAT} ${CLANG_TIDY}

    - name: Configure CMake
      # Use a bash shell so we can use the same syntax for environment variable
      # access regardless of the host operating system
      shell: bash
      working-directory: ${{runner.workspace}}/build
      # Note the current convention is to use the -S and -B options here to specify source
      # and build directories, but this is only available with CMake 3.13 and higher.
      # The CMake binaries on the Github Actions machines are (as of this writing) 3.12
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -GNinja -DCLANG_FORMAT=${CLANG_FORMAT} -DCLANG_TIDY=${CLANG_TIDY}

    - name: Setup Environment (PR)  
      if: ${{ github.event_name == 'pull_request' }}  
      shell: bash  
      run: |  
        echo "AFTER_COMMIT_SHA=${{ github.event.pull_request.head.sha }}" >> ${GITHUB_ENV}  
        echo "BEFORE_COMMIT_SHA=${{ github.event.pull_request.base.sha }}" >> ${GITHUB_ENV}  

    - name: Setup Environment (Push)  
      if: ${{ github.event_name == 'push' }}  
      shell: bash  
      run: |  
        echo "AFTER_COMMIT_SHA=${{ github.event.after }}" >> ${GITHUB_ENV}
        echo "BEFORE_COMMIT_SHA=${{ github.event.before }}" >> ${GITHUB_ENV}

    - name: format lint
      working-directory: ${{runner.workspace}}
      shell: bash
      run: |
        cmake --build ${{runner.workspace}}/build -t format-sources
        if [[ `git -C $GITHUB_WORKSPACE status --porcelain` ]]; then
          echo "Format mismatch:";
          git -C $GITHUB_WORKSPACE diff;
          exit 1;
        fi
        

    - name: clang-tidy lint
      working-directory: ${{runner.workspace}}
      shell: bash
      run: |
        cd $GITHUB_WORKSPACE
        if [ "${{env.BEFORE_COMMIT_SHA}}" == "0000000000000000000000000000000000000000" ]
        then
          echo 'BUILD_DIR=${{runner.workspace}}/build $GITHUB_WORKSPACE/tools/lint-tidy.sh ${{env.AFTER_COMMIT_SHA}}'
          BUILD_DIR=${{runner.workspace}}/build $GITHUB_WORKSPACE/tools/lint-tidy.sh ${{env.AFTER_COMMIT_SHA}}
        else
          echo 'BUILD_DIR=${{runner.workspace}}/build $GITHUB_WORKSPACE/tools/lint-tidy.sh ${{env.BEFORE_COMMIT_SHA}}..${{env.AFTER_COMMIT_SHA}}'
          BUILD_DIR=${{runner.workspace}}/build $GITHUB_WORKSPACE/tools/lint-tidy.sh ${{env.BEFORE_COMMIT_SHA}}..${{env.AFTER_COMMIT_SHA}}
        fi
        
